name: CI

on:
  push:
    # Wave branches are pushed before the fast-forward into dev, so this is where the signal
    # matters. main is here for release merges.
    branches: [main, dev, 'feat/**', 'fix/**', 'chore/**']
    # The last two are not decoration: EnvironmentDocumentationTest reads them and fails when a
    # variable the application resolves is missing from .env.example, so a commit touching only
    # those files can turn the build red. Without them listed, that commit would not run CI at
    # all and the failure would surface on somebody else's unrelated push to backend/.
    #
    # Repeated below rather than shared through a YAML anchor: Actions does not resolve aliases in
    # workflow files, and an unsupported `*watched` is a workflow that fails to parse.
    paths: ['backend/**', '.github/workflows/ci.yml', '.env.example', 'docker-compose.yml']
  pull_request:
    branches: [main, dev]
    paths: ['backend/**', '.github/workflows/ci.yml', '.env.example', 'docker-compose.yml']

# Pushing a fix two minutes after a push should not leave both runs competing for a runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: mvn verify
    runs-on: ubuntu-latest
    # A hung container start would otherwise burn the 6-hour default.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          # Not a tuning knob: Sonar decides which lines are "new code" from git blame, and the
          # default depth-1 clone gives it no history to blame, so it grades either everything or
          # nothing as new. Both fail silently -- a green run whose gate judged the wrong lines.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          # Resolved from the repository root, NOT from defaults.run.working-directory --
          # that applies to `run:` steps only. A wrong path here does not fail the build,
          # it just silently never caches.
          cache-dependency-path: backend/pom.xml

      # Docker is present on ubuntu-latest, so Testcontainers needs no setup step. The tests
      # themselves still need no secrets: the JWT signing key and the bcrypt strength come from
      # the surefire and failsafe argLine, and Postgres comes from the container. SONAR_TOKEN
      # below is the only one, and it is used by the analysis, not by anything under test.
      #
      # One invocation, and the order inside it is load-bearing. `verify` has to finish before
      # `sonar:sonar` looks for target/site/jacoco/jacoco.xml, and a useful consequence of putting
      # them in one command is that a failed coverage gate stops the build before anything is
      # uploaded -- so Sonar never records an analysis for a commit that was never green.
      #
      # `sonar.qualitygate.wait=true` is what makes a red gate a red build. Without it the analysis
      # uploads, the gate fails on the dashboard, and this job reports success.
      #
      # SONAR_TOKEN is a repository secret and is absent on pull requests from forks, where this
      # step therefore fails rather than skipping. Nobody forks this repository; if that changes,
      # guard the step with `if: env.SONAR_TOKEN != ''` rather than dropping the wait.
      - name: Build, test and analyse
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B -ntp verify sonar:sonar -Dsonar.qualitygate.wait=true

      # Same root-relative rule as cache-dependency-path: an action, not a `run`.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7

      # `always()`, unlike the step above: the coverage report is most wanted on the run that
      # just failed its own coverage gate, and jacoco:report runs before jacoco:check for
      # exactly that reason. A run that never reached the report simply uploads nothing.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7
