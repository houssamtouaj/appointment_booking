name: CI

# No `paths:` filter, deliberately. main requires this job as a status check, and a release is a
# fast-forward -- so main's tip is whatever SHA dev's tip is. Under a filter, a commit outside it
# produces no check run on that SHA at all, and GitHub does not read "never ran" as "passed": the
# release push is rejected outright, and the only escape is to unprotect the branch. One README-only
# commit on dev is enough to do it. Building on every push costs about ninety seconds and makes
# every SHA answerable, which is the property the protection rule depends on.
#
# It also subsumes the reason the filter had to name .env.example and docker-compose.yml:
# EnvironmentDocumentationTest reads them and fails when a variable the application resolves is
# missing from .env.example, so a commit touching only those files can turn the build red. That
# commit now runs CI itself instead of surfacing on somebody else's unrelated push to backend/.
on:
  push:
    # Wave branches are pushed before the fast-forward into dev, so this is where the signal
    # matters. main is here for release merges.
    branches: [main, dev, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main, dev]

# Pushing a fix two minutes after a push should not leave both runs competing for a runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: mvn verify
    runs-on: ubuntu-latest
    # A hung container start would otherwise burn the 6-hour default.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          # Resolved from the repository root, NOT from defaults.run.working-directory --
          # that applies to `run:` steps only. A wrong path here does not fail the build,
          # it just silently never caches.
          cache-dependency-path: backend/pom.xml

      # Docker is present on ubuntu-latest, so Testcontainers needs no setup step. No secrets
      # either: the JWT signing key and the bcrypt strength come from the surefire and
      # failsafe argLine, and Postgres comes from the container.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      # Same root-relative rule as cache-dependency-path: an action, not a `run`.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7

      # `always()`, unlike the step above: the coverage report is most wanted on the run that
      # just failed its own coverage gate, and jacoco:report runs before jacoco:check for
      # exactly that reason. A run that never reached the report simply uploads nothing.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7
