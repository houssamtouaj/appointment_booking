# =====================================================================================
# SlotFlow API — Render blueprint.
#
#   Render dashboard -> New -> Blueprint -> point it at this repository.
#
# Everything here is committable because nothing here is a secret: the two values that are
# get `sync: false`, which means "ask me in the dashboard and never store me in git", and
# JWT_SECRET is generated by Render itself. Read `.env.example` for what each variable does;
# this file only says where its value comes from.
#
# Two things this file cannot do for you, and both are in the README's deploy checklist:
#   * DB_URL — Render exposes a database's host, port and user to a service, but not a JDBC
#     URL, and a blueprint cannot interpolate one. Paste it once from the database's
#     Connections panel: jdbc:postgresql://<internal-host>:5432/<database>
#   * the Stripe webhook endpoint, which has to be created against the deployed URL and
#     therefore cannot exist until after the first deploy.
#
# It has not been applied to a live account from this file yet. If Render rejects a field,
# the shape of this blueprint is still the record of what the deployment needs.
# =====================================================================================

databases:
  - name: slotflow-postgres
    databaseName: slotflow
    user: slotflow
    # Must match the web service's region below. Render defaults a blueprint database to its
    # own default region rather than to the region of whatever references it, and the internal
    # hostname in DB_URL is not routable across regions — so a mismatch here is not a latency
    # problem, it is the first deploy dying on Flyway with a connection timeout.
    region: frankfurt
    # Free tier: 1 GB, and expires after 30 days. The demo is rebuilt from the seeder on any
    # empty database, which is the honest answer to "what is your backup story" for a demo —
    # and it is why the seeder is idempotent rather than a one-shot migration.
    plan: free

services:
  - type: web
    name: slotflow-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: frankfurt
    # `free` idles after fifteen minutes and then takes ~30 seconds to answer the first
    # request, which breaks the brief's "loads in under 3 seconds". `starter` does not idle.
    # If this is on `free`, the README has to say so next to the demo link rather than
    # letting a reviewer conclude the API is slow — see the README's note on cold starts.
    plan: starter
    # Wired to the platform probe, so a wedged instance is restarted without anyone watching.
    # /actuator/health and nothing wider: /actuator/** would publish whatever a future
    # dependency decides to register there.
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      # Seeds the demo salon and registers POST /api/auth/demo-login. Without it the deployed
      # API is correct, empty, and useless as a demo.
      - key: SPRING_PROFILES_ACTIVE
        value: demo

      # --- database ---------------------------------------------------------------------
      # JDBC URL, pasted once; see the header. The credentials below come from the database
      # above, so they are never in this file and rotate with it.
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        fromDatabase:
          name: slotflow-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: slotflow-postgres
          property: password
      # The free tier's connection cap is low, and Hikari holding ten per instance is how a
      # second instance fails to start rather than how it runs slowly.
      - key: DB_POOL_MAX
        value: "5"

      # --- auth -------------------------------------------------------------------------
      # Generated by Render and never seen by anyone, which is the correct handling for a
      # signing key: nothing needs to read it except this service.
      - key: JWT_SECRET
        generateValue: true
      # True because the browser reaches this over TLS. False here means the browser silently
      # drops the refresh cookie and every session dies after fifteen minutes, with nothing in
      # any log to say why.
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      # None, not the Lax default, because the SPA is on Vercel and the API is on onrender.com:
      # that is a cross-site request, and a Lax cookie is not attached to one. Left at Lax the
      # SPA's POST /api/auth/refresh arrives with no cookie, 401s, and every deployed session
      # dies at the fifteen-minute access-token TTL with no way to recover. None is only safe
      # alongside REFRESH_COOKIE_SECURE=true above, which AuthProperties enforces at startup.
      - key: REFRESH_COOKIE_SAME_SITE
        value: "None"

      # --- URLs -------------------------------------------------------------------------
      # Both are set in the dashboard, after the frontend has a URL. CORS_ALLOWED_ORIGINS is
      # the Vercel origin plus http://localhost:5173, comma-separated — never `*`, which the
      # app now refuses at startup rather than per preflight (CorsConfig).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      # Also the dashboard, and it has to be the full https:// origin. `fromService … property:
      # host` resolves to a bare hostname, and Render has no way to prefix a scheme onto it — a
      # schemeless value lands in the OpenAPI document's servers[0].url, where a URL without a
      # scheme is a *relative* one, so every Swagger "Try it out" resolves against the docs page
      # and 404s. Set it to https://slotflow-api.onrender.com once the service has its hostname.
      - key: PUBLIC_API_URL
        sync: false
      # Render terminates TLS at its own proxy and overwrites X-Forwarded-For, so the rate
      # limiter keys on the real client rather than on one IP for the whole internet.
      - key: FORWARD_HEADERS_STRATEGY
        value: framework

      # --- mail -------------------------------------------------------------------------
      # A real relay, because the whole point of deploying is that the confirmation email
      # arrives. MAIL_FROM must be an address the relay's verified domain owns.
      - key: MAIL_ENABLED
        value: "true"
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_SMTP_STARTTLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

      # --- payments ---------------------------------------------------------------------
      # Test mode, and off until the keys are in. On without STRIPE_SECRET_KEY is a startup
      # failure by design: the alternative is an API that boots and fails on the first
      # customer who tries to pay, by which point their slot has been held for half an hour.
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: STRIPE_SECRET_KEY
        sync: false
      # The signing secret of the endpoint created against the deployed URL — this is the
      # entire authentication of POST /api/webhooks/stripe.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
