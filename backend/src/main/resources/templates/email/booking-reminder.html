<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><title>Your appointment is tomorrow</title></head>
<body style="margin:0;padding:24px;background:#f9fafb;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:#111827">
<div style="max-width:560px;margin:0 auto;background:#ffffff;padding:32px;border-radius:8px">

    <div th:replace="~{email/_parts :: header(${booking.businessName()})}"></div>

    <h1 style="margin:0 0 16px;font-size:20px;font-weight:600">See you tomorrow</h1>

    <p style="margin:0 0 16px;line-height:22px">
        Hello <span th:text="${booking.guestName()}">Alex</span>, a reminder about your
        appointment.
    </p>

    <table style="width:100%;border-collapse:collapse;margin:0 0 24px">
        <tr>
            <td style="padding:8px 0;color:#6b7280;width:110px">What</td>
            <td style="padding:8px 0" th:text="${booking.serviceName()}">Service</td>
        </tr>
        <tr>
            <td style="padding:8px 0;color:#6b7280">When</td>
            <td style="padding:8px 0;font-weight:600">
                <span th:text="${booking.whenText()}">Tue 14 Oct, 15:00 CEST</span>
                until <span th:text="${booking.untilText()}">16:00 CEST</span>
            </td>
        </tr>
        <tr>
            <td style="padding:8px 0;color:#6b7280">With</td>
            <td style="padding:8px 0" th:text="${booking.staffName()}">Dana</td>
        </tr>
        <tr th:if="${booking.depositPaidCents() > 0}">
            <td style="padding:8px 0;color:#6b7280">To pay</td>
            <td style="padding:8px 0" th:text="${booking.outstandingText()}">31.50</td>
        </tr>
    </table>

    <!--/* The manage link is the point of this mail: a reminder that a customer cannot act on is a
           reminder that produces a no-show instead of a cancellation. */-->
    <p style="margin:0">
        <a th:href="${booking.manageUrl()}"
           style="display:inline-block;background:#111827;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:6px;font-weight:600">
            Cannot make it? Cancel here
        </a>
    </p>

    <div th:replace="~{email/_parts :: footer}"></div>
</div>
</body>
</html>
