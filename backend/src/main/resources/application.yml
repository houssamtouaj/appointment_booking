# =====================================================================================
# SlotFlow API — defaults for every environment.
#
# Rules this file obeys:
#   * no secret is ever written here; every credential is read from the environment
#     and documented in .env.example
#   * Flyway owns the schema, Hibernate only looks at it
#   * UTC at rest and on the wire; zone conversion is the client's job
# =====================================================================================
spring:
  application:
    name: slotflow-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/slotflow}
    username: ${DB_USERNAME:slotflow}
    # DB_PASSWORD is what Compose passes to the api container. POSTGRES_PASSWORD is the
    # fallback so that a host-side run against the Compose database works after
    # `set -a; . ./.env` — without it, the documented `mvn spring-boot:run` dies on an empty
    # password and the message names neither variable.
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:}}
    hikari:
      pool-name: slotflow-pool
      maximum-pool-size: ${DB_POOL_MAX:10}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate is only allowed to check that the mapping and
      # the tables agree. This stays `validate` forever — a mismatch must fail on startup,
      # not halfway through a request.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # Nothing for Jackson here on purpose. The JSON conventions are part of the published contract
  # and live in config/JacksonConfig.java, whose customiser is applied after this file and would
  # win anyway: two spellings of the same setting means editing the visible one changes nothing.

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

  task:
    execution:
      thread-name-prefix: slotflow-async-
      pool:
        core-size: 2
        max-size: 8
        queue-capacity: 100

server:
  # SERVER_PORT first, then PORT, then 8080. The middle one is not padding: Railway, Render, Fly and
  # Heroku all inject PORT and expect the process to bind it, and Spring reads only the first
  # spelling — so without this chain the container starts, listens on 8080, answers nothing the
  # platform routes to it, and fails its health check with a perfectly healthy application inside.
  port: ${SERVER_PORT:${PORT:8080}}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  # `none` is the correct default: it makes getRemoteAddr() the real peer, which is what the
  # rate limiter keys on. A deploy that terminates TLS at a proxy sets this to `framework`, and
  # must be certain the proxy overwrites X-Forwarded-For rather than appending to a caller's.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

logging:
  pattern:
    # Every line carries the X-Request-Id echoed to the caller, so a reported 500 is one grep.
    correlation: "[%X{requestId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

app:
  openapi:
    title: SlotFlow API
    version: v1
    # comma-separated; the first entry is what Swagger UI calls by default
    server-urls: ${PUBLIC_API_URL:http://localhost:8080}
  cors:
    # comma-separated. 5173 is the Vite dev server; production origins come from the env.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Whether this deployment sends mail at all. Off selects NotificationService's logging
  # implementation: no SMTP, no templates, every message and its links written to the log instead.
  # That is the demo profile, and the switch that keeps a dead relay from taking a feature down.
  # On by default, because the opposite is a deployment that quietly sends nothing and looks
  # identical to a working one until a customer says they never got their confirmation.
  mail:
    enabled: ${MAIL_ENABLED:true}
    # The envelope sender. A relay will refuse a From it does not own, so this differs per deploy.
    from: ${MAIL_FROM:no-reply@slotflow.local}
  # D12. In-memory Bucket4j buckets, so these budgets are per instance: a two-container deploy
  # doubles them. Honest for a single-instance demo; a real one moves the store to Redis and
  # changes nothing else. Windows refill smoothly, not in one jump at the end.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Per IP on POST /api/auth/login. Ahead of BCrypt on purpose.
    login:
      capacity: 10
      window: PT1M
    # Per IP on every other unauthenticated write under /api/auth/** and /api/public/**.
    public-write:
      capacity: 10
      window: PT1M
    # Per guest email on booking creation; enforced in plan 10's service, not in the filter,
    # because the address only exists once the body is parsed.
    guest-booking:
      capacity: 5
      window: PT1H
  # Where the SPA is served from. Only used to build the links in outbound mail: the reset link,
  # the invitation link and the manage-booking link that every customer-facing message carries.
  # The routes those assume are pinned by FrontendLinksTest.
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  security:
    jwt:
      # at least 32 bytes, environment only; the app refuses to start without it
      secret: ${JWT_SECRET:}
      access-token-ttl: PT15M
      refresh-token-ttl: P7D
    # The refresh token's transport: httpOnly cookie, scoped to /api/auth.
    # The name and path are constants in RefreshTokenCookie; only these two vary by environment.
    refresh-cookie:
      # true wherever a browser reaches the API over TLS. False on plain-HTTP localhost, or the
      # browser silently drops the cookie and every refresh fails with no visible cause.
      secure: ${REFRESH_COOKIE_SECURE:false}
      # Lax by default because localhost:5173 -> localhost:8080 is same-site, and Lax is the CSRF
      # answer described in RefreshTokenCookie. A deployment that puts the SPA on one registrable
      # domain and the API on another (Vercel + Render) is cross-site, and a Lax cookie is not
      # attached to a cross-site request at all: refresh 401s and every session dies at the
      # access-token TTL. Those deployments must set None — which browsers only honour together
      # with Secure, so AuthProperties refuses the unsafe half of that pair at startup.
      same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
    # D6: single-use, one hour. Plan 06: invitations last a week.
    password-reset-ttl: PT1H
    invitation-ttl: P7D
    # 10-12 in production. The test suite drops it to 4 (see the surefire argLine in pom.xml):
    # BCrypt is deliberately slow, and a suite that logs in a hundred times pays for it.
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
    # Deletes expired refresh and reset tokens once a day, off-peak. refresh_token gains a row on
    # every login and every rotation and nothing else ever deletes one, so without this the largest
    # table in the schema only grows. Expired rows only, never revoked-but-live ones: those are what
    # reuse detection reads. `-` disables the job; the suite sets that, because a sweep firing while
    # a test has moved the clock forward would delete rows it is about to assert on. Read directly
    # rather than through AuthProperties because @Scheduled needs a resolvable placeholder.
    token-sweep-cron: ${TOKEN_SWEEP_CRON:0 15 3 * * *}
  # D2/D3. Off means every booking is created CONFIRMED and nothing ever reaches Stripe, which is
  # what keeps the deployed demo working when a test key expires. On, a deposit-requiring business
  # creates a PENDING booking that holds its slot for 30 minutes and carries a Stripe Checkout URL,
  # and the booking is confirmed by the webhook rather than by anything the browser reports.
  #
  # Turning this on without STRIPE_SECRET_KEY is a startup failure, deliberately: the alternative is
  # a deployment that boots, serves every page, and fails on the first customer who tries to pay -
  # by which point their slot has been held for half an hour for nothing.
  payments:
    enabled: ${PAYMENTS_ENABLED:false}
  booking:
    # The PENDING sweeper (D3). Every minute, because the hold is 30 minutes and a slot released a
    # minute late costs nobody anything. `-` disables it, which the integration suite sets: the
    # suite moves the clock forward by hours at a time, and a sweep firing on its own schedule
    # would cancel rows a test is about to assert on. ExpiredBookingSweepIT calls it directly.
    expiry-sweep-cron: ${BOOKING_EXPIRY_SWEEP_CRON:0 * * * * *}
    # The 24-hour reminder (plan 12). Every fifteen minutes; the job's window overlaps deliberately
    # so a missed run catches up, and reminder_sent_at makes the overlap free. `-` disables it, and
    # the integration suite sets that for the same reason it disables the sweeper: BookingReminderJob
    # is called directly by the test that asserts what it sends.
    reminder-cron: ${BOOKING_REMINDER_CRON:0 */15 * * * *}
  stripe:
    # Environment only, and no defaults on purpose: a committed fallback would look like
    # configuration and behave like a live credential. Blank is valid - it is what app.payments
    # being off means - and StripeProperties never prints either of them.
    #
    # The webhook secret is the whole authentication of POST /api/webhooks/stripe. Anyone who can
    # reach that path can claim a booking is paid; only somebody holding this can prove it.
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
