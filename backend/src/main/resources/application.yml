# =====================================================================================
# SlotFlow API — defaults for every environment.
#
# Rules this file obeys:
#   * no secret is ever written here; every credential is read from the environment
#     and documented in .env.example
#   * Flyway owns the schema, Hibernate only looks at it
#   * UTC at rest and on the wire; zone conversion is the client's job
# =====================================================================================
spring:
  application:
    name: slotflow-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/slotflow}
    username: ${DB_USERNAME:slotflow}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: slotflow-pool
      maximum-pool-size: ${DB_POOL_MAX:10}

  jpa:
    open-in-view: false
    hibernate:
      # `none` until the Flyway baseline exists (plan 02), then `validate` forever:
      # validating against an empty schema fails startup.
      ddl-auto: none
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

  task:
    execution:
      thread-name-prefix: slotflow-async-
      pool:
        core-size: 2
        max-size: 8
        queue-capacity: 100

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

app:
  openapi:
    title: SlotFlow API
    version: v1
    # comma-separated; the first entry is what Swagger UI calls by default
    server-urls: ${PUBLIC_API_URL:http://localhost:8080}
  cors:
    # comma-separated. 5173 is the Vite dev server; production origins come from the env.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:no-reply@slotflow.local}
  security:
    jwt:
      # consumed from plan 05 onwards; at least 32 bytes, environment only
      secret: ${JWT_SECRET:}
      access-token-ttl: PT15M
      refresh-token-ttl: P7D
  stripe:
    # consumed from plan 11 onwards
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
