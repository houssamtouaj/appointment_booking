<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Book an appointment, and run the day it lands in." />
    <!-- Declares which schemes this document supports, and nothing more: with no
         further input the UA resolves it from prefers-color-scheme, i.e. from the
         OS. That is the right answer only for the "follow the OS" state. When a
         theme has actually been chosen, the script below stamps it as an inline
         style on <html> so the pre-paint canvas, the scrollbar and every native
         control follow the choice instead of the OS. theme.css carries the same
         declaration for every state after the stylesheet lands. -->
    <meta name="color-scheme" content="light dark" />

    <!-- Fonts are third-party and render-blocking by default; preconnect buys back
         the DNS and TLS round trip. `display=swap` means a slow font shows fallback
         text rather than nothing — the booking flow has to be readable on a bad
         connection, which is the same reason the theme script below exists. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    />

    <title>SlotFlow</title>

    <!--
      Theme, stamped before first paint.

      This has to be a blocking inline script in <head>, and it has to run before
      the stylesheet is applied. React mounts several hundred milliseconds later;
      anything that waits for it paints a white page first and then corrects
      itself, which is the white flash the wave 1 gate names — worst on exactly
      the throttled connection where it is least forgivable.

      It reads localStorage rather than a cookie because the choice is per-device
      and never leaves it, and it stays a plain string rather than JSON so that a
      corrupted value degrades to "system" instead of throwing.

      Three states, not two: absent means follow the OS, and the media query in
      theme.css handles that case on its own. Only an explicit choice is stamped.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('slotflow-theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored)
            // The attribute alone is not enough before the stylesheet lands: the
            // canvas the browser paints in the meantime comes from the meta tag
            // above, which follows the OS. Dark chosen on a light OS would flash
            // white — the flash this whole script exists to prevent. An inline
            // style is the one thing that applies immediately. use-theme.ts
            // clears it again when the user goes back to "system".
            document.documentElement.style.colorScheme = stored
          }
        } catch (_) {
          /* Private mode, or storage disabled. Fall through to the OS preference. */
        }
      })()
    </script>

    <!--
      Document language, stamped before first paint.

      Less urgent than the theme script above — there is no flash of the wrong
      language, because there is no text until React mounts. It is here for the
      two things that are read at parse time and not re-read later: a screen
      reader chooses its voice from <html lang>, and the browser chooses
      hyphenation and spell-checking from it.

      The static lang="en" on <html> is a placeholder, not the answer: this
      script stamps the attribute on every path, including the English one, so
      that the derived value is never left to a default that happens to agree.
      src/i18n/language.ts keeps it true after a switch, and stamps it again at
      module init in case anything ever loads this document without the script.

      It must derive the language exactly as detect() does in
      src/i18n/language.ts — the same walk over navigator.languages, the same
      match on any fr-* tag. The two cannot import each other (this runs before
      any module is evaluated), so src/i18n/language.test.ts runs this very
      script against stubbed globals and fails if the answers diverge.
    -->
    <script>
      ;(function () {
        var chosen = null
        try {
          var stored = localStorage.getItem('slotflow-lang')
          if (stored === 'en' || stored === 'fr') chosen = stored
        } catch (_) {
          /* Private mode, or storage disabled. Fall through to the browser. */
        }
        if (chosen === null) {
          // navigator.languages and not navigator.language, matching detect():
          // a French speaker on an English-first OS often lists fr second, and
          // reading only the first tag renders the whole app in French under
          // <html lang="en"> — the one thing this script exists to get right.
          var preferences = navigator.languages || [navigator.language || 'en']
          for (var i = 0; i < preferences.length; i++) {
            var base = String(preferences[i]).toLowerCase().split('-')[0]
            if (base === 'en' || base === 'fr') {
              chosen = base
              break
            }
          }
        }
        document.documentElement.lang = chosen || 'en'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
