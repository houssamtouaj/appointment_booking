# =====================================================================================
# SlotFlow — local stack.
#
#   cp .env.example .env && docker compose up
#
# The api container reads its configuration from the environment only; there is no
# `local` Spring profile in here. Ports on the host:
#   8080 api · 8025 MailHog UI · 1025 MailHog SMTP · 5432 Postgres
# =====================================================================================
name: slotflow

services:
  postgres:
    image: postgres:16-alpine
    container_name: slotflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-slotflow}
      POSTGRES_USER: ${POSTGRES_USER:-slotflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — see .env.example}
      # Explicit, and portable across base images: UTF-8 storage with byte-order
      # collation, so ORDER BY is deterministic wherever this runs.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slotflow} -d ${POSTGRES_DB:-slotflow}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: slotflow-mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"   # SMTP the api talks to
      - "${MAILHOG_UI_PORT:-8025}:8025"     # web UI: http://localhost:8025
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: slotflow-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-slotflow}
      DB_USERNAME: ${POSTGRES_USER:-slotflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-no-reply@slotflow.local}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — see .env.example}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

  # The SPA arrives with the frontend plans. Until then the Vite dev server on the host
  # (npm run dev, port 5173) is already an allowed CORS origin.
  #
  # web:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: slotflow-web
  #   depends_on: [api]
  #   environment:
  #     VITE_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8080}
  #   ports:
  #     - "5173:80"

volumes:
  postgres-data:
