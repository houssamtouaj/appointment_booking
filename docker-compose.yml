# =====================================================================================
# SlotFlow — local stack.
#
#   cp .env.example .env && docker compose up
#
# The api container reads its configuration from the environment only; there is no
# `local` Spring profile in here. Ports on the host:
#   8080 api · 8025 MailHog UI · 1025 MailHog SMTP · 5432 Postgres
# =====================================================================================
name: slotflow

services:
  postgres:
    image: postgres:16-alpine
    container_name: slotflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-slotflow}
      POSTGRES_USER: ${POSTGRES_USER:-slotflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — see .env.example}
      # UTF-8 storage with byte-order collation, so ORDER BY is deterministic wherever this
      # runs — but collation and ctype are set separately on purpose. A blanket --locale=C
      # gives the cluster an ASCII-only LC_CTYPE and initdb accepts it in silence: lower('É')
      # then returns 'É' unchanged and ILIKE '%é%' never matches 'É', so an accented staff or
      # service name stops matching its own search. --lc-ctype=C.UTF-8 fixes that and leaves
      # collation alone.
      #
      # Both apply at initdb, i.e. only to an empty volume: editing this line does nothing to
      # an existing cluster, which needs `docker compose down -v` (or a dump and restore).
      #
      # Byte collation still sorts 'Zoe' before 'alice', accents last. That is invisible today
      # because nothing sorts by name in SQL; the first listing that does should move this to
      # --locale-provider=icu --icu-locale=und, which sorts the way a human expects and is
      # just as reproducible across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slotflow} -d ${POSTGRES_DB:-slotflow}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: slotflow-mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"   # SMTP the api talks to
      - "${MAILHOG_UI_PORT:-8025}:8025"     # web UI: http://localhost:8025
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: slotflow-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # `demo` by default, which is what makes `docker compose up` from a clean clone yield a
      # *seeded* API rather than an empty one: a sign-in screen with no account behind it is not a
      # working stack, however green the health check is. The seeder skips entirely once the demo
      # business exists, so this costs nothing on a restart. Note `-` and not `:-`: setting
      # SPRING_PROFILES_ACTIVE= (empty) in .env gives a bare instance, which `:-` would ignore.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE-demo}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-slotflow}
      DB_USERNAME: ${POSTGRES_USER:-slotflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_FROM: ${MAIL_FROM:-no-reply@slotflow.local}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — see .env.example}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      # Off by default, so the stack comes up with no Stripe account at all. On without a
      # secret key is a startup failure, deliberately - see .env.example.
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # The three schedules, forwarded so that setting one in .env actually reaches the container.
      # A single "-" disables a job; the defaults here match application.yml, so an unset variable
      # changes nothing. Without these lines .env.example documents knobs that silently do nothing.
      TOKEN_SWEEP_CRON: ${TOKEN_SWEEP_CRON:-0 15 3 * * *}
      BOOKING_EXPIRY_SWEEP_CRON: ${BOOKING_EXPIRY_SWEEP_CRON:-0 * * * * *}
      BOOKING_REMINDER_CRON: ${BOOKING_REMINDER_CRON:-0 */15 * * * *}
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

  # The SPA arrives with the frontend plans. Until then the Vite dev server on the host
  # (npm run dev, port 5173) is already an allowed CORS origin.
  #
  # web:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: slotflow-web
  #   depends_on: [api]
  #   environment:
  #     VITE_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8080}
  #   ports:
  #     - "5173:80"

volumes:
  postgres-data:
